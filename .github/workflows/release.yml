---
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Verify the tag matches galaxy.yml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version:' galaxy.yml | awk '{print $2}')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match galaxy.yml version $version"
            exit 1
          fi

      - name: Build
        run: ansible-galaxy collection build --output-path dist/

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |-
          ansible-galaxy collection publish dist/*.tar.gz --api-key "$GALAXY_API_KEY"
