---
# Docker publishes separate repos per distribution. Derived from facts so this
# works on Debian and Ubuntu alike; override for a derivative whose
# ansible_distribution is not what Docker publishes under (e.g. Linux Mint ->
# ubuntu, Raspbian -> debian).
vps_docker_distribution: "{{ ansible_facts['distribution'] | lower }}"
vps_docker_release: "{{ ansible_facts['distribution_release'] | lower }}"

vps_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

vps_docker_keyring: /etc/apt/keyrings/docker.asc
vps_docker_service_enabled: true
vps_docker_service_state: started

# Written to /etc/docker/daemon.json when non-empty. Left empty by default so the
# role does not fight a daemon.json managed elsewhere.
vps_docker_daemon_options: {}
