---
- name: Assert users are defined
  ansible.builtin.assert:
    that: vps_users | length > 0
    fail_msg: >-
      vps_users is empty - set it to the users this host should have, otherwise
      the hardened sshd config leaves no way to log in.

- name: Generate SSH keypairs on the control machine
  ansible.builtin.include_tasks: generate_keys.yml
  when: vps_generate_ssh_keys

- name: Create users
  ansible.builtin.include_tasks: user.yml
  loop: "{{ vps_users | dict2items }}"
  loop_control:
    loop_var: user
    label: "{{ user.key }}"
