---
# Runs on the control machine: the private keys must never reach the target.
- name: Manage local SSH keys
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Remove the previous key backup
      ansible.builtin.file:
        path: "{{ vps_ssh_key_dir }}.old"
        state: absent
      when: vps_rotate_ssh_keys | bool

    - name: Move the current keys aside
      ansible.builtin.command:
        cmd: mv {{ vps_ssh_key_dir | quote }} {{ (vps_ssh_key_dir ~ '.old') | quote }}
        removes: "{{ vps_ssh_key_dir }}"
      when: vps_rotate_ssh_keys | bool
      changed_when: true

    - name: Ensure the key directory exists
      ansible.builtin.file:
        path: "{{ vps_ssh_key_dir }}"
        state: directory
        mode: "0700"

    # `creates:` makes this a no-op once the key exists, which is what keeps
    # re-runs from rotating keys behind your back.
    - name: Generate a keypair per user
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -q -t ed25519 -N ''
          -C {{ (inventory_hostname ~ ' ' ~ item.key) | quote }}
          -f {{ (vps_ssh_key_dir ~ '/id_' ~ item.key) | quote }}
        creates: "{{ vps_ssh_key_dir }}/id_{{ item.key }}"
      loop: "{{ vps_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
