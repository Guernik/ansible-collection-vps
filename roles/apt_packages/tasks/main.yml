---
- name: Clear the APT cache
  ansible.builtin.apt:
    autoclean: true
  when: vps_apt_autoclean | bool
  changed_when: false

- name: Install packages
  ansible.builtin.apt:
    name: "{{ vps_apt_packages + vps_apt_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ vps_apt_cache_valid_time }}"
