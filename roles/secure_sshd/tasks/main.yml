---
# Validate before installing: a malformed drop-in makes sshd refuse to start,
# and on a remote host that means losing the only way back in.
- name: Deploy SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ vps_sshd_config_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
