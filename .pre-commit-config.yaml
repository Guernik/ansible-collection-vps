# Pre-commit hooks for this Ansible repo.
# Install once:  just hooks-install   (or: pre-commit install)
# Run manually:  just lint            (or: pre-commit run --all-files)
# https://pre-commit.com/
---
minimum_pre_commit_version: "3.5.0"

exclude: ^\.venv/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
        # Ansible uses custom tags and multi-doc files; only parse, allow them.
        args: ["--allow-multiple-documents"]

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
